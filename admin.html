<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Latien 広告管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./">
        <span class="brand-mark">L</span>
        <span class="brand-text">Latien<small>広告管理（管理者専用）</small></span>
      </a>
    </div>
  </header>

  <main class="wrap admin">
    <section class="panel">
      <h3>1. GitHub との接続</h3>
      <p class="muted">保存は GitHub のリポジトリ（<code>ads.json</code>）に直接書き込みます。書き込み権限のあるトークンを持つ人だけが保存でき、閲覧者には変更できません。トークンはこのブラウザ内にだけ保存されます。</p>
      <div class="form-row">
        <label for="repo">リポジトリ</label>
        <input id="repo" type="text" spellcheck="false" autocomplete="off">
      </div>
      <div class="form-row">
        <label for="token">アクセストークン</label>
        <input id="token" type="password" spellcheck="false" autocomplete="off" placeholder="github_pat_...">
      </div>
      <div class="btn-row left">
        <button class="btn" id="check">接続を確認</button>
        <button class="btn" id="forget">トークンを消去</button>
        <span id="conn" class="muted"></span>
      </div>
    </section>

    <section class="panel">
      <h3>2. 広告の設定</h3>
      <label class="check"><input type="checkbox" id="enabled"> サイト全体で広告を表示する</label>
      <div id="slots"></div>
    </section>

    <section class="panel sticky-save">
      <div class="btn-row left">
        <button class="btn primary" id="save">GitHub に保存して公開</button>
        <button class="btn" id="copy">JSON をコピー</button>
        <span id="status" class="muted"></span>
      </div>
      <p class="muted small">保存後、GitHub Pages に反映されるまで1〜2分かかります。</p>
    </section>
  </main>

  <script src="js/ads.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
